[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=System
Author=poiru
Information=CPU and RAM monitoring with rounded glass design.
Version=2.0

[Variables]
fontName=Segoe UI
textSize=9
colorBar=235,0,0,255
colorText=245,246,248,255

[TextStyle]
FontFace=Segoe UI
FontColor=245,246,248
AntiAlias=1
StringAlign=CenterCenter
DynamicVariables=1

; -----------------------------
; MEASURES
; -----------------------------

[measureCPU]
Measure=CPU
Processor=0

[measureRAM]
Measure=PhysicalMemory
UpdateDivider=20

; -----------------------------
; GLASS CARD
; -----------------------------

[Card]
Meter=Shape
Shape=Rectangle 6,9,250,130,24 | Fill Color 0,0,0,190 | StrokeWidth 7 | Stroke Color 0,0,0,255
; Shape=Rectangle 6,9,220,125,20 | Fill Color 0,0,0,32 | StrokeWidth 0
; Shape2=Rectangle 4,4,220,125,20 | Fill LinearGradient GlassTint | StrokeWidth 1 | Stroke LinearGradient GlassEdge

; GlassTint=120 | 47,54,60,207 ; 0.0 | 20,25,31,231 ; 1.0
; GlassEdge=120 | 241,249,255,110 ; 0.0 | 224,239,250,20 ; 0.55 | 241,249,255,50 ; 1.0

; Shape3=Rectangle 6,6,216,121,18 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 255,255,255,10
; Shape4=Rectangle 14,12,200,48,14 | Fill LinearGradient Reflection | StrokeWidth 0
; Reflection=270 | 238,247,255,14 ; 0.0 | 238,247,255,0 ; 1.0

; Shape5=Line 20,39,208,39 | StrokeWidth 1 | Stroke Color 230,241,250,25

; -----------------------------
; TEXT STYLES
; -----------------------------

[styleTitle]
StringAlign=CenterCenter
StringCase=Upper
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=10
AntiAlias=1

[styleLeftText]
StringAlign=LeftCenter
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleRightText]
StringAlign=RightCenter
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

; -----------------------------
; METERS
; -----------------------------

[meterTitle]
Meter=String
MeterStyle=TextStyle
X=132
Y=27
W=190
H=20
FontSize=10
FontWeight=600
FontColor=209,217,226
ClipString=1
Text=System
LeftMouseUpAction=["taskmgr.exe"]
ToolTipText=Open Task Manager

[meterLabelCPU]
Meter=String
MeterStyle=styleLeftText
X=20
Y=57
W=120
H=18
Text=CPU Usage

[meterValueCPU]
Meter=String
MeterStyle=styleRightText
MeasureName=measureCPU
X=240
Y=57
W=60
H=18
Text=%1%

[meterBarCPU]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureCPU
X=20
Y=74
W=220
H=4

[meterLabelRAM]
Meter=String
MeterStyle=styleLeftText
X=20
Y=94
W=120
H=18
Text=RAM Usage

[meterValueRAM]
Meter=String
MeterStyle=styleRightText
MeasureName=measureRAM
X=240
Y=94
W=60
H=18
Text=%1%
Percentual=1

[meterBarRAM]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureRAM
X=20
Y=111
W=220
H=4
