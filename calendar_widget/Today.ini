[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
LocalFont=#@#Fonts\Doto.ttf

[Metadata]
Name=Today
Author=Nathan Alvares
Information=Today's Google Calendar events as a station departure board.
Version=2.0

@Include=#CURRENTPATH#Feeds.inc

; ---------- data ----------

[MeasureGoogle]
Measure=WebParser
URL=#GoogleURL#
Download=1
DownloadFile=google.ics
UserAgent=Mozilla/5.0
UpdateRate=900
FinishAction=[!CommandMeasure MeasureScript "Load()"]
OnConnectErrAction=[!Log "Today: could not reach Google feed" Warning]
OnDownloadErrAction=[!Log "Today: Google feed download failed" Warning]

; re-renders once a minute: statuses move on, rolls over at midnight
[MeasureScript]
Measure=Script
ScriptFile=#@#Today.lua
UpdateDivider=60

[MeasureClock]
Measure=Time
Format=%H:%M

; ---------- styles ----------

[Dot]
FontFace=Doto
FontWeight=800
FontColor=238,232,216
AntiAlias=1

[Time]
FontSize=13
FontColor=255,176,32
StringAlign=LeftCenter
X=20

[Title]
FontSize=12
StringAlign=LeftCenter
X=78
W=200
ClipString=1

[Status]
FontSize=10
StringAlign=RightCenter
X=340
Padding=6,2,6,2

; ---------- board ----------

; slab, header rule, 8 row modules (Shape3-10) and footer rule (Shape11); Lua sizes them
[Board]
Meter=Shape
Shape=Rectangle 0.5,0.5,359,200,8 | Fill Color 14,13,11 | StrokeWidth 1 | Stroke Color 58,54,46
Shape2=Line 12,48,348,48 | StrokeWidth 1 | Stroke Color 255,176,32,55

[Label]
Meter=String
MeterStyle=Dot
X=18
Y=27
StringAlign=LeftCenter
FontSize=13
FontColor=255,176,32
Text=TODAY

