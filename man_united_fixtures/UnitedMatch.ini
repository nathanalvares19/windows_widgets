[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
FeedURL=https://calendar.google.com/calendar/ical/ov0dk4m6dedaob7oqse4nrda4s%40group.calendar.google.com/public/basic.ics

[MeasureFeed]
Measure=WebParser
URL=#FeedURL#
Download=1
DownloadFile=fixtures.ics
UserAgent=Mozilla/5.0
UpdateRate=3600
FinishAction=[!CommandMeasure MeasureScript "Refresh()"]
OnConnectErrAction=[!Log "UnitedMatch: could not connect to feed" Warning]
OnDownloadErrAction=[!Log "UnitedMatch: feed download failed" Warning]

[MeasureScript]
Measure=Script
ScriptFile=#@#Fixture.lua

[Card]
Meter=Shape
Shape=Rectangle 6,9,360,258,24 | Fill Color 0,0,0,190 | StrokeWidth 7 | Stroke Color 0,0,0,255
; Shape2=Rectangle 4,4,356,258,24 | Fill LinearGradient GlassTint | StrokeWidth 1 | Stroke LinearGradient GlassEdge
; GlassTint=120 | 47,54,60,207 ; 0.0 | 20,25,31,231 ; 1.0
; GlassEdge=120 | 241,249,255,110 ; 0.0 | 224,239,250,20 ; 0.55 | 241,249,255,50 ; 1.0
; Shape3=Rectangle 6,6,352,254,22 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color 255,255,255,10
; Shape4=Rectangle 14,12,336,94,17 | Fill LinearGradient Reflection | StrokeWidth 0
; Reflection=270 | 238,247,255,14 ; 0.0 | 238,247,255,0 ; 1.0
; Shape5=Line 28,211,336,211 | StrokeWidth 1 | Stroke Color 230,241,250,25

[TextStyle]
FontFace=Segoe UI
FontColor=245,246,248
AntiAlias=1
StringAlign=CenterCenter
DynamicVariables=1

[SmallStyle]
FontSize=8
FontColor=170,180,192
StringCase=Upper

[Label]
Meter=String
MeterStyle=TextStyle
X=182
Y=34
W=304
H=20
FontSize=10
FontWeight=600
FontColor=209,217,226
ClipString=1
Text=[&MeasureScript:GetBoardLabel()]
; ToolTipText=[&MeasureScript:GetBoardLabel()]

[HomeLogo]
Meter=Image
ImageName=[&MeasureScript:GetTeamLogo('home')]
X=68
Y=68
W=64
H=64
PreserveAspectRatio=1
DynamicVariables=1

[AwayLogo]
Meter=Image
ImageName=[&MeasureScript:GetTeamLogo('away')]
X=232
Y=68
W=64
H=64
PreserveAspectRatio=1
DynamicVariables=1

