[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
LocalFont=#@#Fonts\BarlowCondensed-Bold.ttf
LocalFont2=#@#Fonts\BarlowCondensed-SemiBold.ttf
LocalFont3=#@#Fonts\Barlow-Medium.ttf
LocalFont4=#@#Fonts\Barlow-SemiBold.ttf

[Metadata]
Name=Man United Fixtures (ticket)
Author=Nathan Alvares
Information=The next United fixture printed as a matchday ticket.
Version=4.0

[Variables]
FeedURL=https://calendar.google.com/calendar/ical/ov0dk4m6dedaob7oqse4nrda4s%40group.calendar.google.com/public/basic.ics
Paper=250,250,248
Ink=20,20,20
Grey=105,105,105
Red=218,41,28
Perf=150,150,146

; ---------- data ----------

[MeasureFeed]
Measure=WebParser
URL=#FeedURL#
Download=1
DownloadFile=fixtures.ics
UserAgent=Mozilla/5.0
UpdateRate=3600
FinishAction=[!CommandMeasure MeasureScript "Refresh()"]
OnConnectErrAction=[!Log "UnitedMatch: could not connect to feed" Warning]
OnDownloadErrAction=[!Log "UnitedMatch: feed download failed" Warning]

[MeasureScript]
Measure=Script
ScriptFile=#@#Fixture.lua

; ---------- ticket stock ----------

[Ticket]
Meter=Shape
; one sheet with the two perforation notches cut out
Shape=Rectangle 8,8,344,168,6 | Fill Color #Paper# | StrokeWidth 1 | Stroke Color 0,0,0,40
Shape2=Ellipse 260,8,8
Shape3=Ellipse 260,176,8
Shape4=Combine Shape | Exclude Shape2 | Exclude Shape3
; punched tear line: round dots, not a divider dash
Shape5=Line 260,22,260,162 | StrokeWidth 2 | Stroke Color #Perf# | StrokeDashes 0.1,3.5 | StrokeDashCap Round | StrokeStartCap Round | StrokeEndCap Round
Shape6=Line 28,142,240,142 | StrokeWidth 1 | Stroke Color 0,0,0,28

[Stub]
Meter=Shape
DynamicVariables=1
; transparent until matchday, then United red
Shape=Rectangle 261,8,91,168,6 | Fill Color [&MeasureScript:GetStubFill()] | StrokeWidth 0
Shape2=Rectangle 261,8,12,168 | Fill Color [&MeasureScript:GetStubFill()] | StrokeWidth 0
Shape3=Ellipse 260,8,8
Shape4=Ellipse 260,176,8
Shape5=Combine Shape | Union Shape2 | Exclude Shape3 | Exclude Shape4

; ---------- styles ----------

[Print]
FontFace=Barlow
FontWeight=500
FontColor=#Grey#
AntiAlias=1
DynamicVariables=1
StringAlign=LeftCenter

[Small]
FontFace=Barlow
FontWeight=600
FontSize=8
StringCase=Upper
InlineSetting=CharacterSpacing | 0.6 | 0.6

; ---------- ticket body ----------

[OppLogo]
Meter=Image
ImageName=[&MeasureScript:GetOpponentLogo()]
X=26
Y=22
W=40
H=40
PreserveAspectRatio=1
DynamicVariables=1

; initials only show when no crest image exists for the club
[OppFallback]
Meter=String
MeterStyle=Print
StringAlign=CenterCenter
X=46
Y=42
FontFace=Barlow Condensed
FontWeight=700
FontSize=16
FontColor=#Ink#
Text=[&MeasureScript:GetOpponentInitials()]

[Opponent]
Meter=String
MeterStyle=Print
X=82
Y=42
W=170
H=44
ClipString=1
FontFace=Barlow Condensed
FontWeight=700
FontSize=[&MeasureScript:GetOpponentSize()]
FontColor=#Ink#
Text=[&MeasureScript:GetOpponentName()]
ToolTipText=[&MeasureScript:GetOpponentName()]

; connector sits in the name column so the names stack: Sporting / v / Man United
[Connector]
Meter=String
MeterStyle=Print
X=84
Y=76
FontFace=Barlow Condensed
FontWeight=600
FontSize=13
Text=[&MeasureScript:GetConnector()]

; United row mirrors the opponent row exactly
[UnitedLogo]
Meter=Image
ImageName=[&MeasureScript:GetUnitedLogo()]
X=26
Y=90
W=40
H=40
PreserveAspectRatio=1
DynamicVariables=1

[United]
Meter=String
MeterStyle=Print
X=82
Y=110
W=170
H=44
ClipString=1
FontFace=Barlow Condensed
FontWeight=700
FontSize=[&MeasureScript:GetOpponentSize()]
FontColor=#Ink#
Text=[&MeasureScript:GetUnitedName()]
ToolTipText=Manchester United

; the issuer's printed mark closes the body
[Issuer]
Meter=String
MeterStyle=Print|Small
X=28
Y=159
W=224
H=16
ClipString=1
FontColor=#Red#
Text=[&MeasureScript:GetIssuer()]

; ---------- stub ----------

[WDay]
Meter=String
MeterStyle=Print|Small
StringAlign=CenterCenter
X=306
Y=34
FontColor=[&MeasureScript:GetStubSub()]
Text=[&MeasureScript:GetStub('wday')]

[Day]
Meter=String
MeterStyle=Print
StringAlign=CenterCenter
X=306
Y=64
FontFace=Barlow Condensed
FontWeight=700
FontSize=24
FontColor=[&MeasureScript:GetStubInk()]
Text=[&MeasureScript:GetStub('day')]

[Month]
Meter=String
MeterStyle=Print|Small
StringAlign=CenterCenter
X=306
Y=92
FontColor=[&MeasureScript:GetStubSub()]
Text=[&MeasureScript:GetStub('month')]

[Kickoff]
Meter=String
MeterStyle=Print
StringAlign=CenterCenter
X=306
Y=124
FontFace=Barlow Condensed
FontWeight=600
FontSize=18
FontColor=[&MeasureScript:GetStubInk()]
Text=[&MeasureScript:GetStub('time')]
ToolTipText=[&MeasureScript:GetKickoff()]

[Countdown]
Meter=String
MeterStyle=Print|Small
StringAlign=CenterCenter
X=306
Y=153
FontSize=10
FontColor=[&MeasureScript:GetStubInk()]
Text=[&MeasureScript:GetCountdown()]
