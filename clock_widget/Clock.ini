 [Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Clock
Author=poiru
Information=Date and time with rounded card design.
Version=2.0

[Variables]
fontName=Segoe UI
colorText=245,246,248,255

[TextStyle]
FontFace=#fontName#
FontColor=#colorText#
AntiAlias=1
StringAlign=CenterCenter
DynamicVariables=1

; -----------------------------
; MEASURES
; -----------------------------

[measureTime]
Measure=Time
Format=%H:%M:%S

[measureDate]
Measure=Time
Format=%d.%m.%Y

[measureDay]
Measure=Time
Format=%A

; -----------------------------
; CARD
; -----------------------------

[Card]
Meter=Shape
Shape=Rectangle 6,9,360,350,24 | Fill Color 0,0,0,190 | StrokeWidth 7 | Stroke Color 0,0,0,255

; -----------------------------
; METERS
; -----------------------------

[meterTitle]
Meter=String
MeterStyle=TextStyle
X=181
Y=34
W=290
H=30
FontSize=10
FontWeight=600
FontColor=209,217,226
Text=Clock

[meterTime]
Meter=String
MeterStyle=TextStyle
MeasureName=measureTime
X=186
Y=180
W=350
H=90
FontSize=48
FontWeight=600
Text=%1

[meterSeparator]
Meter=Shape
Shape=Line 35,245,327,245 | StrokeWidth 1 | Stroke Color 255,255,255,30

[meterDay]
Meter=String
MeterStyle=TextStyle
MeasureName=measureDay
X=181
Y=278
W=290
H=30
FontSize=15
FontWeight=600
Text=%1

[meterDate]
Meter=String
MeterStyle=TextStyle
MeasureName=measureDate
X=181
Y=316
W=290
H=30
FontSize=13
Text=%1
