
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Network
Author=poiru
Information=IP address and network activity.
Version=2.0

[Variables]
fontName=Segoe UI
textSize=9
colorBar=235,0,0,255
colorText=245,246,248,255
maxDownload=10485760
maxUpload=10485760

; -----------------------------
; MEASURES
; -----------------------------

[measureIP]
Measure=WebParser
URL=https://checkip.amazonaws.com/
UpdateRate=14400
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"N/A"

[measureNetIn]
Measure=NetIn
NetInSpeed=#maxDownload#

[measureNetOut]
Measure=NetOut
NetOutSpeed=#maxUpload#

; -----------------------------
; CARD
; -----------------------------

[Card]
Meter=Shape
Shape=Rectangle 6,9,250,150,24 | Fill Color 0,0,0,190 | StrokeWidth 7 | Stroke Color 0,0,0,255

; -----------------------------
; TEXT STYLES
; -----------------------------

[TextStyle]
FontFace=#fontName#
FontColor=#colorText#
AntiAlias=1
StringAlign=CenterCenter
DynamicVariables=1

[styleLeftText]
StringAlign=LeftCenter
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleRightText]
StringAlign=RightCenter
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1
ClipString=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,15

; -----------------------------
; METERS
; -----------------------------

[meterTitle]
Meter=String
MeterStyle=TextStyle
X=132
Y=27
W=190
H=20
FontSize=10
FontWeight=600
FontColor=209,217,226
ClipString=1
Text=Network

; IP ADDRESS

[meterIPLabel]
Meter=String
MeterStyle=styleLeftText
X=20
Y=52
W=110
H=18
Text=IP Address

[meterIPValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureIP
X=240
Y=52
W=130
H=18
Text=%1

; SEPARATOR

[meterSeparator]
Meter=Shape
Shape=Line 20,72,240,72 | StrokeWidth 1 | Stroke Color 255,255,255,25

; UPLOAD

[meterUploadLabel]
Meter=String
MeterStyle=styleLeftText
X=20
Y=86
W=110
H=18
Text=Upload

[meterUploadValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureNetOut
X=240
Y=86
W=110
H=18
Text=%1B/s
NumOfDecimals=1
AutoScale=1

[meterUploadBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureNetOut
X=20
Y=100
W=220
H=4

; DOWNLOAD

[meterDownloadLabel]
Meter=String
MeterStyle=styleLeftText
X=20
Y=117
W=110
H=18
Text=Download

[meterDownloadValue]
Meter=String
MeterStyle=styleRightText
MeasureName=measureNetIn
X=240
Y=117
W=110
H=18
Text=%1B/s
NumOfDecimals=1
AutoScale=1

[meterDownloadBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measureNetIn
X=20
Y=131
W=220
H=4
